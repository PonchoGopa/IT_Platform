{% extends 'base.html' %}{% block content %}<p class="eyebrow">TRAZABILIDAD</p><h1>Auditoría</h1><section class="card table"><table><tr><th>Fecha (UTC)</th><th>Usuario</th><th>Acción</th><th>Referencia</th></tr>{% for event, username in rows %}<tr><td>{{ event.created_at }}</td><td>{{ username or 'Sistema' }}</td><td>{{ event.action }}</td><td>{{ event.target }}</td></tr>{% else %}<tr><td colspan="4">Sin eventos.</td></tr>{% endfor %}</table></section><p class="muted">Últimos 200 eventos.</p>{% endblock %}
