{% extends 'base.html' %}
{% block content %}
<section class="login card">
  <span class="module-icon" aria-hidden="true">◇</span>
  <p class="eyebrow">ACCESO INTERNO</p><h1>Bienvenido a tu espacio.</h1>
  <p class="muted">Ingresa con tu cuenta de IT Platform para continuar.</p>
  <form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Usuario<input name="username" required maxlength="100" autocomplete="username" placeholder="Tu nombre de usuario"></label>
    <label>Contraseña<input name="password" type="password" required autocomplete="current-password" placeholder="Ingresa tu contraseña"></label>
    <button>Iniciar sesión <span aria-hidden="true">→</span></button>
  </form>
  <p class="login-help">Equipos · Soporte · Credenciales</p>
</section>
{% endblock %}
